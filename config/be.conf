# tang_db BE(数据层)配置文件
#
# 语法:一行一项 key = value;# 开头的整行是注释,空行忽略。
# 取值优先级:命令行参数 > 本文件 > 内置默认值。
#   例:./scripts/start-be.sh --port=9200        # 临时换端口,不改文件
#   例:./scripts/start-be.sh --config=其他配置文件

# 数据目录:LSM 数据、WAL、segment、MANIFEST 都放这里
data_dir = ./data/BE

# gRPC 监听端口
port = 9100

# memtable 刷盘阈值,支持 64MB / 1MB / 32KB / 1048576(纯字节数)
memtable_size = 64MB

# ---- 注册与心跳(向 FE 上报自身状态)----
# FE 心跳服务地址与端口(注意:不是 BE 自己的 gRPC 端口)
fe_host = 127.0.0.1
fe_port = 9091

# 心跳间隔(秒)。连续 heartbeat_interval_seconds × be_offline_cycles 未收到即判不可用
heartbeat_interval_seconds = 3

# ---- P3:事务(SPEC-P3 FR-309 / FR-364)----
# 单事务写入量上限(批记录载荷);超过 → 报 "事务写入量超过上限(64MB)"
max_txn_write_bytes = 64MB

# 崩溃注入点(仅验收使用;默认空 = 关闭)
# 取值:before_wal / after_fsync / after_memtable / before_ok
# 命中一次即让 BE 进程立即退出(模拟 taskkill /F),启动日志会明显告警。
test_crash_point =

# ---- P6.1:写路径性能(SPEC-P6.1 §5.2)----
# WAL 追加缓冲池大小(默认 1MB;可写 64KB / 1MB / 1048576)
wal_buffer_bytes = 1MB

# 一次 fsync 最多合并的提交数(group commit;1-65536)
group_commit_max_batch = 64

# 攒批的最长等待毫秒数,超时立即 fsync(0-1000;0 = 不等待)
group_commit_max_wait_ms = 5
