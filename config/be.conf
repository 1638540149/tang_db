# tang_db BE(数据层)配置文件
#
# 语法:一行一项 key = value;# 开头的整行是注释,空行忽略。
# 取值优先级:命令行参数 > 本文件 > 内置默认值。
#   例:./scripts/start-be.sh --port=9200        # 临时换端口,不改文件
#   例:./scripts/start-be.sh --config=其他配置文件

# 数据目录:LSM 数据、WAL、segment、MANIFEST 都放这里
data_dir = ./data/BE

# gRPC 监听端口
port = 9100

# memtable 刷盘阈值,支持 64MB / 1MB / 32KB / 1048576(纯字节数)
memtable_size = 64MB

# ---- 注册与心跳(向 FE 上报自身状态)----
# FE 心跳服务地址与端口(注意:不是 BE 自己的 gRPC 端口)
fe_host = 127.0.0.1
fe_port = 9091

# 心跳间隔(秒)。连续 heartbeat_interval_seconds × be_offline_cycles 未收到即判不可用
heartbeat_interval_seconds = 3
