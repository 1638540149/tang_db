# tang_db FE(客户端层)配置文件
#
# 语法:一行一项 key = value;# 开头的整行是注释,空行忽略。
# 取值优先级:命令行参数 > 本文件 > 内置默认值。
#   例:./scripts/start-fe.sh --be-port=9200     # 临时连另一个端口,不改文件

# 要连接的 BE 地址
be_host = 127.0.0.1
be_port = 9100

# ---- 心跳与存活判定(P2) ----
# FE 接收 BE 注册/心跳的 gRPC 监听端口(与 BE 的 be_port=9100 区分开)
heartbeat_listen_port = 9091

# 连续多少个心跳周期(默认 3 秒一次)未收到心跳即判 BE 不可用
be_offline_cycles = 3

# ---- P3:心跳开关(SPEC-P3 FR-366 / K57)----
# false:不绑定心跳端口、不启动 FE 侧 gRPC 服务,SQL 照常;
#        同一台机器可以开多个 CLI 会话做并发验收。
# true(默认):端口被占用即启动失败(P2 FR-158 行为不变)。
heartbeat_enabled = true
