# tang_db FE(客户端层)配置文件
#
# 语法:一行一项 key = value;# 开头的整行是注释,空行忽略。
# 取值优先级:命令行参数 > 本文件 > 内置默认值。
#   例:./scripts/start-fe.sh --config=其他/fe.conf

# 要连接的 BE 地址(fed 用它连 BE;CLI 瘦客户端不直连 BE)
be_host = 127.0.0.1
be_port = 9100

# ---- P3.5:运行模式(§5.6)----
# fed = 常驻服务(持有 catalog 与会话层,监听 mysql_port);cli = 瘦客户端
mode = fed

# MySQL 协议监听端口(SPEC-P3.5 §12 I10,3306 留给真 MySQL)
mysql_port = 3406

# ---- 认证凭据(SPEC-P3.5 §5.6 / K63)----
# 明文口令只在配置文件;fed 启动时派生 SHA1(SHA1(pw)) 存内存,不落盘不进日志
user = root
password = tangdb

# ---- 会话(SPEC-P3.5 §5.6 / FR-411 / FR-412)----
# 会话上限;超过拒绝连接
session_max = 64
# 空闲超时(秒),0 = 不超时
session_idle_timeout = 0
# 优雅退出等待在途语句的上限(秒,K73)
shutdown_grace_seconds = 5

# ---- 心跳与存活判定(P2) ----
# FE 接收 BE 注册/心跳的 gRPC 监听端口(与 BE 的 be_port=9100 区分开)
heartbeat_listen_port = 9091

# 连续多少个心跳周期(默认 3 秒一次)未收到心跳即判 BE 不可用
be_offline_cycles = 3

# ---- P3:心跳开关(SPEC-P3 FR-366 / K57)----
# false:不绑定心跳端口、不启动 FE 侧 gRPC 服务,SQL 照常;
# true(默认):端口被占用即启动失败(P2 FR-158 行为不变)。
heartbeat_enabled = true

# ---- P4:建索引回填批量(SPEC-P4 K84 / FR-467)----
# CREATE INDEX 在非空表上分批回填,每批独立提交并推进 build_cursor。
index_backfill_batch = 1000

# ---- P6.1:执行层性能(SPEC-P6.1 §5.2)----
# 扫描与算子的并行度(默认 min(8, CPU);1 时执行路径与 P6 完全一致)
query_parallelism = 8

# 列投影 + 谓词下推总开关(默认 true;false + query_parallelism=1 = P6 行为)
pushdown_enabled = true

# 扫描批行数(默认 4096,自适应上限 8192)
scan_batch_rows = 4096

# 三档 RPC 期限(秒):普通读写/事务、批量导入与回填与 ANALYZE、范围/分片扫描
rpc_deadline_seconds = 5
rpc_bulk_deadline_seconds = 60
rpc_scan_deadline_seconds = 60

# ---- P8:协议侧(SPEC-P8 §5.3 / FR-819)----
# 协议连接上限;超限的新连接回 1040(已有连接不受影响)
mysql_max_connections = 128

# 协议空闲超时(秒),0 = 不断开;>0 时空闲到期断开并落日志
mysql_wait_timeout = 0

# TLS:本期未实现。置 true 时 fed 直接启动失败并说明原因(不静默降级,K197)
mysql_ssl = false

# ---- P8:监控指标(SPEC-P8 §5.3 / FR-829)----
# false 时不采集不计时:/metrics 返回空文本,SHOW METRICS 返回空集
metrics_enabled = true

# ---- P8:慢查询与诊断(SPEC-P8 §5.3 / FR-831 ~ FR-839)----
slow_query_log = true
# 超过该耗时的语句落 sys_slow_query;0 等价于关闭
slow_query_threshold_ms = 200
# 记录上限,超出按时间淘汰最旧
slow_query_max_rows = 10000

# ---- P8:Web 控制台(SPEC-P8 §5.3 / FR-851 / FR-852)----
# 控制台 HTTP 服务(JDK 内置 HttpServer);端口被占用则 fed 启动失败并指出端口
console_enabled = true
console_port = 8080

# ---- P8:备份(SPEC-P8 §5.3 / FR-841)----
# 默认备份根目录:BACKUP 里给相对路径时拼到它下面(空 = 相对当前工作目录)
backup_dir = ./tmp/backup
