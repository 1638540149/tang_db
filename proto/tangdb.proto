// tang_db 服务间接口定义
//
// 这是 FE(Java)与 BE(Go)之间唯一的通信契约。两侧的桩代码都由 protoc 从本文件生成,
// 禁止手写序列化/反序列化。
//
// 边界铁律(见设计文档 §4.1):
//   - 本文件里不得出现任何"表名""列名""SQL"的概念
//   - FE 传给 BE 的永远是 key/value 与算子描述
//
// 本文件包含 P1(基座)、P2(表与 SQL)与 P3(事务与 MVCC)所需的接口。
// 后续期次的接口按规约逐步加入,不提前定义未实现的东西。
//
// P3 key 约定(SPEC-P3 §5.1 / §5.2):
//   - FE 传来的 key 一律是"用户键",不含尾部的 8 字节版本段;
//   - 版本段由 BE 独占维护(写入时追加 ^commit_ts,大端),FE 不得拼装或解释它;
//   - 范围扫描的 start_key / end_key 也是用户键级语义 [start, end)。

syntax = "proto3";

package tangdb.v1;

option java_package = "com.wangyu.tangdb.proto";
option java_multiple_files = true;
option java_outer_classname = "TangDbProto";
option go_package = "github.com/1638540149/tang_db/be/internal/server/pb;pb";

// 统一状态码。BE 不返回 HTTP 语义,只用这一套。
enum StatusCode {
  STATUS_UNSPECIFIED = 0;
  OK                 = 1;
  NOT_FOUND          = 2;
  INVALID_ARGUMENT   = 3;
  INTERNAL           = 4;
  // CONFLICT:写写冲突(SPEC-P3 FR-307)。conflict_key 带回冲突 key 的原始字节,
  // 由 FE 翻译成"表 t 主键 x 写写冲突";BE 不返回表名/列名/SQL。
  CONFLICT           = 5;
}

// ---------------------------------------------------------------- 探活

message PingRequest {}

message PingResponse {
  string version   = 1;   // BE 版本号
  string data_dir  = 2;   // 当前数据目录(便于排查)
}

// ---------------------------------------------------------------- 写入

message PutRequest {
  bytes key   = 1;
  bytes value = 2;
}

message PutResponse {
  StatusCode status  = 1;
  string     message = 2;
}

// ---------------------------------------------------------------- 读取

message GetRequest {
  // 用户键(不含版本段)。BE 返回该用户键在快照下可见的版本值。
  bytes key = 1;
  // 快照水位(SPEC-P3 FR-304):0 = 最新已提交;否则返回 commit_ts <= snapshot 的最大版本。
  uint64 snapshot = 2;
}

message GetResponse {
  StatusCode status  = 1;
  bytes      value   = 2;   // 仅在 status == OK 时有意义
  string     message = 3;
}

// ---------------------------------------------------------------- 范围扫描

// 一条原始键值对。P2 起 FE 把编码后的行放进 value,BE 不解释其内容。
message Kv {
  bytes key   = 1;
  bytes value = 2;
}

message ScanRequest {
  // start_key / end_key 是**用户键级**语义(SPEC-P3 FR-305),不含版本段:
  // BE 按"去掉 key 尾部 8 字节"后的用户键比较范围。
  bytes  start_key  = 1;   // 含
  bytes  end_key    = 2;   // 不含;空 = 到末尾
  uint32 limit      = 3;   // 0 = 不限;限制的是"每个用户键只输出一次"之后的行数
  uint32 batch_rows = 4;   // 0 = 默认 1024
  // 快照水位(SPEC-P3 FR-304):0 = 最新已提交。
  uint64 snapshot   = 5;

  // ---- SPEC-P6.1 §5.1:只加字段,不改既有字段语义 ----
  // 位图:第 k 位 = 是否要第 k 列。0 = 不裁剪(老路径,回整行)。
  uint32 column_mask      = 6;
  // 每列槽位(序号 + 字节宽度/长度前缀描述),由 FE 生成;BE 只按偏移切片。
  bytes  column_slots     = 7;
  // 行框架参数:nullmap 字节数 + 列数。
  bytes  row_frame        = 8;
  // 谓词字节码:列槽号 + 保序编码后的字面量字节;BE 只做字节比较。
  bytes  predicate        = 9;
  // true = 需要列式块返回;false = 逐 KV(兼容老路径)。
  bool   columnar_result  = 10;
}

// 服务端流式返回的一批行。status 不是 OK 时表示扫描中途出错,
// 客户端必须把它当作失败结束,不能当成正常截断。
message RowBatch {
  StatusCode  status  = 1;
  string      message = 2;
  repeated Kv rows    = 3;
  // SPEC-P6.1 FR-707:原始字节块 + 偏移数组;为空则回退逐 KV。
  // 布局:[行数 u32][每行偏移 u32 ×(行数+1)][行框架字节]
  bytes       columnar_block = 4;
}

// ---------------------------------------------------------------- 事务(P3)

// 开始一个事务:BE 返回事务句柄与快照水位。
// 写集不在 BE:未提交的写入只活在 FE 内存里,BE 只在 CommitTxn 时看到它们。
message BeginTxnRequest {
  bool read_only = 1;   // 本期只是提示,不改变语义(SPEC-P3 K47)
}

message BeginTxnResponse {
  StatusCode status   = 1;
  string     message  = 2;
  uint64     txn_id   = 3;   // BE 侧句柄,不参与可见性
  uint64     snapshot = 4;   // 当前已提交水位;空库为 0
}

// 提交:写集按用户键给出(不含版本段),BE 内部追加版本段。
// 顺序固定:冲突检测 → WAL 追加 → fsync → memtable → OK。
message CommitTxnRequest {
  uint64 txn_id   = 1;   // 0 = 自动提交(不占用 BE 句柄)
  uint64 snapshot = 2;   // 0 = 最新已提交;否则为 BeginTxn 返回的水位
  repeated Kv writes = 3; // 写集:key 为用户键
}

message CommitTxnResponse {
  StatusCode status       = 1;
  uint64     commit_ts    = 2;   // 成功时给出;写集为空时可能为 0
  bytes      conflict_key = 3;   // status == CONFLICT 时的冲突 key(原始字节,FE 负责翻译)
  string     message      = 4;
}

// 释放 BE 侧事务句柄(不产生任何 I/O)。未提交的数据从未离开 FE,所以无需回滚动作。
message AbortTxnRequest {
  uint64 txn_id = 1;
}

message AbortTxnResponse {
  StatusCode status  = 1;
  string     message = 2;
}

// ---------------------------------------------------------------- 服务

service TangDb {
  // 探活:客户端与验收脚本用来确认 BE 已就绪
  rpc Ping(PingRequest) returns (PingResponse);

  // 写入一个键值。语义与 P1 保持不变:BE 内部把它当成"单 key 自动提交事务"。
  // 返回 OK 意味着数据已被日志与 fsync 保护,进程被 kill -9 后仍然存在。
  rpc Put(PutRequest) returns (PutResponse);

  // 读取一个键值(用户键)。key 不存在返回 NOT_FOUND,而不是空值。
  rpc Get(GetRequest) returns (GetResponse);

  // 按用户键范围有序流式扫描。范围语义 [start_key, end_key),end_key 为空表示到末尾。
  // 同一用户键只出现一次(取快照下可见版本);limit 为 0 表示不限;batch_rows 为 0 表示默认 1024。
  rpc Scan(ScanRequest) returns (stream RowBatch);

  // ---- P3:事务 ----
  rpc BeginTxn(BeginTxnRequest) returns (BeginTxnResponse);
  rpc CommitTxn(CommitTxnRequest) returns (CommitTxnResponse);
  rpc AbortTxn(AbortTxnRequest) returns (AbortTxnResponse);
}

// ---------------------------------------------------------------- BE → FE:注册与心跳
//
// 注意方向:这两个 RPC 的服务端在 FE 进程,BE 是客户端。

message RegisterBeRequest {
  string be_id                      = 1;
  string endpoint                   = 2;
  string version                    = 3;
  int64  start_time_unix_millis     = 4;
  uint32 heartbeat_interval_seconds = 5;   // 供 FE 计算判死窗口
}

message RegisterBeResponse {
  StatusCode status  = 1;
  string     message = 2;
}

message HeartbeatRequest {
  // 身份
  string be_id                      = 1;
  string endpoint                   = 2;
  string version                    = 3;
  int64  start_time_unix_millis     = 4;
  uint32 heartbeat_interval_seconds = 5;

  // 存储
  string data_dir              = 10;
  uint64 disk_total_bytes      = 11;
  uint64 disk_available_bytes  = 12;

  // 内存表
  uint64 memtable_bytes           = 20;
  uint32 immutable_memtable_count = 21;

  // 磁盘文件
  uint32 segment_count = 30;
  uint64 segment_bytes = 31;
  uint64 wal_bytes     = 32;

  // 服务量
  uint64 put_count        = 40;
  uint64 get_count        = 41;
  uint64 scan_count       = 42;
  uint64 put_error_count  = 43;
  uint64 get_error_count  = 44;
  uint64 scan_error_count = 45;

  // 持久性
  int64 last_fsync_unix_millis = 50;

  // 扫描剪枝(SPEC-P6.1 FR-706):chunk 解码次数 / 因 key 范围(ZoneMap 二分)
  // 被跳过的 chunk 数;SHOW SEGMENTS 展示用。只加字段,不改既有语义。
  uint64 chunks_read        = 60;
  uint64 chunks_skipped     = 61;
}

message HeartbeatResponse {
  StatusCode status  = 1;
  string     message = 2;
}

service TangDbFrontend {
  rpc RegisterBe      (RegisterBeRequest) returns (RegisterBeResponse);
  rpc ReportHeartbeat (HeartbeatRequest)  returns (HeartbeatResponse);
}
