// tang_db 服务间接口定义
//
// 这是 FE(Java)与 BE(Go)之间唯一的通信契约。两侧的桩代码都由 protoc 从本文件生成,
// 禁止手写序列化/反序列化。
//
// 边界铁律(见设计文档 §4.1):
//   - 本文件里不得出现任何"表名""列名""SQL"的概念
//   - FE 传给 BE 的永远是 key/value 与算子描述
//
// 本文件当前只包含 P1(基座)所需的接口。后续期次的接口按规约逐步加入,
// 不提前定义未实现的东西。

syntax = "proto3";

package tangdb.v1;

option java_package = "com.wangyu.tangdb.proto";
option java_multiple_files = true;
option java_outer_classname = "TangDbProto";
option go_package = "github.com/1638540149/tang_db/be/internal/server/pb;pb";

// 统一状态码。BE 不返回 HTTP 语义,只用这一套。
enum StatusCode {
  STATUS_UNSPECIFIED = 0;
  OK                 = 1;
  NOT_FOUND          = 2;
  INVALID_ARGUMENT   = 3;
  INTERNAL           = 4;
}

// ---------------------------------------------------------------- 探活

message PingRequest {}

message PingResponse {
  string version   = 1;   // BE 版本号
  string data_dir  = 2;   // 当前数据目录(便于排查)
}

// ---------------------------------------------------------------- 写入

message PutRequest {
  bytes key   = 1;
  bytes value = 2;
}

message PutResponse {
  StatusCode status  = 1;
  string     message = 2;
}

// ---------------------------------------------------------------- 读取

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  StatusCode status  = 1;
  bytes      value   = 2;   // 仅在 status == OK 时有意义
  string     message = 3;
}

// ---------------------------------------------------------------- 服务

service TangDb {
  // 探活:客户端与验收脚本用来确认 BE 已就绪
  rpc Ping(PingRequest) returns (PingResponse);

  // 写入一个键值。返回 OK 意味着数据已被日志与 fsync 保护,
  // 进程被 kill -9 后仍然存在。
  rpc Put(PutRequest) returns (PutResponse);

  // 读取一个键值。key 不存在返回 NOT_FOUND,而不是空值。
  rpc Get(GetRequest) returns (GetResponse);
}
